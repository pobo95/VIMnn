# Advanced reference-site MLIP training recipe.
# Newton training, multiple references, and explicit loss/optimizer controls.
# Values are an example starting point; see README.md before preparing a run.
# All paths are resolved relative to this YAML file.
# Required: this is the recipe file-format version, not a model version.
schema_version: refsite_training_recipe_v1

# Required: the leaf run directory is created when training starts.
# Its parent (this YAML directory) must be writable; an existing leaf is rejected.
output_directory: ./advanced-run

model:
  # Optional; symmetric is the default. Use sequential only for legacy compatibility.
  correlation_method: symmetric
  # Number of residual interaction blocks.
  num_interactions: 2
  # Maximum cumulative order: 3 includes orders 1, 2, and 3 exactly once.
  correlation: 3
  # No general hard upper bound; choose this for available memory and compute.
  hidden_channels: 64
  # Maximum angular degree; supported values are 0, 1, and 2.
  max_L: 2
  # Controls initial parameters, independently of runtime.seed below.
  initialization_seed: 123
  # hidden_irreps is an alternative to hidden_channels + max_L; do not specify both.

reference:
  sources:
    # These keys are user-chosen authoring aliases. Runtime template identity is
    # generated from POSCAR content, not from the alias, filename, or path.
    POSCAR_222:
      poscar: ./references/POSCAR_222
      # Recommended default. A manual value is a validated domain certificate,
      # not a performance knob to make arbitrarily large.
      maximum_strain: auto

    POSCAR_333:
      poscar: ./references/POSCAR_333
      maximum_strain: auto

data:
  train:
    # Several pristine/vacancy files may share one reference alias. Each frame's
    # vacancy count K=M-N is calculated independently.
    - file: ./data/train_pristine_222.xyz
      reference: POSCAR_222
    - file: ./data/train_vacancy_222.xyz
      reference: POSCAR_222
    - file: ./data/train_333.xyz
      reference: POSCAR_333

  validation:
    - file: ./data/validation_222.xyz
      reference: POSCAR_222
    - file: ./data/validation_333.xyz
      reference: POSCAR_333

  # Every declared reference must be used. Each file is fully validated against
  # its declared POSCAR; an incompatible binding never falls back to another one.
  # Different supercell sizes therefore require their corresponding POSCAR.

ot_solver:
  # OT entropy regularization; positive. Shared by training and inference.
  epsilon_ot: 0.5
  # Used only with training: sinkhorn; Newton uses newton.warmup_iterations.
  train_sinkhorn_iterations: 256
  # Choose sinkhorn or newton_krylov. Newton training currently requires dense OT.
  training: newton_krylov
  newton:
    # Sinkhorn initialization before Newton-PCG; not the pure Sinkhorn count above.
    warmup_iterations: 16
    # Up to 30 Newton-PCG steps, followed by two differentiable root corrections.
    max_newton_iterations: 30
    # Maximum PCG iterations per Newton step.
    pcg_max_iterations: 256
    # null selects marginal tolerance 1e-6 for float32, 1e-11 for float64.
    convergence_tolerance: null
    # null selects PCG abs/rel tolerances 1e-8/1e-6 (float32), 1e-13/1e-11 (float64).
    pcg_absolute_tolerance: null
    pcg_relative_tolerance: null
  # This separate adaptive inference preference requires dataset-local qualification.
  # It is applied at prediction/evaluation call time, not to the training solver.
  # Re-qualify after changing geometry; qualification does not cover arbitrary MD.
  inference: sinkhorn_newton_krylov

loss:
  # Relative loss weights, not physical units. Zero disables that supervision.
  energy_weight: 1.0
  forces_weight: 100.0
  # A positive value requires valid stress labels in the extended-XYZ files.
  stress_weight: 10.0
  # Optional. Defaults preserve per-structure energy and scales of 1.
  # per_atom divides the energy error by atom count BEFORE squaring.
  energy_normalization: per_atom
  # Positive divisors of residuals, not multipliers of the loss.
  # Energy units are eV/atom for per_atom, eV for per_structure.
  # Estimate dataset-specific values from TRAIN labels only; these 1s are neutral.
  energy_scale: 1.0
  force_scale: 1.0  # eV/angstrom
  stress_scale: 1.0 # eV/angstrom^3

radii:
  # Angstrom. OT atom-to-reference support cutoff.
  r_ot: 4.0
  # Angstrom. Message-passing graph cutoff. Switch/skin radii are derived.
  # New training derives MP radial normalization from r_mp: x=(r/r_mp)^2.
  # Do not supply edge_length_scale separately.
  r_mp: 3.0

# Recommended for production. Train compositions must have full rank so each
# species baseline is identifiable; there is no silent rank-deficiency fallback.
baseline: fit_full_rank

training:
  # Training and validation batch sizes are independent positive integers.
  batch_size: 5
  validation_batch_size: 5
  max_epochs: 500
  # Training uses AdamW with zero weight decay.
  learning_rate: 1.0e-4
  # Optional; null (default) disables global gradient clipping.
  gradient_clip_norm: 1.0
  # Optional; omission keeps the scheduler disabled. One step per validation epoch.
  scheduler:
    kind: reduce_on_plateau
    factor: 0.5
    patience: 5
    # Relative mode: require a decrease greater than 0.1% of the best loss.
    threshold: 1.0e-3
    threshold_mode: rel
    cooldown: 2
    min_lr: 1.0e-6
  # Default is 15. Allow recovery after LR reductions; null disables early stopping.
  early_stopping_patience: 30
  # Separate from the scheduler threshold: minimum relative improvement for
  # model selection and early stopping. 1e-3 means 0.1% of the best loss.
  early_stopping_relative_delta: 1.0e-3

runtime:
  # Use cuda only on a CUDA-capable system; cpu remains supported.
  device: cuda
  dtype: float32
  # Training Newton solves OT internally in float64 and returns the model dtype.
  # Controls training RNG/data ordering, independently of initialization_seed.
  seed: 123
